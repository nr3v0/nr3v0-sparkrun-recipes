recipe_version: '7'
name: Nemotron-3-Super-NVFP4-cuda-13_3_1-vllm-0_25-Optimized
description: vLLM serving Nemotron-3-Super-120B using cuda 13.3.1 and vllm 0.25
model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
runtime: vllm
container: vllm/vllm-openai:vllm-x86_64-cu13-0.25.1-7a33ba9
mods:
  - gb10-ssu
defaults:
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 1
  gpu_memory_utilization: 0.84
  max_model_len: 262144
  max_num_batched_tokens: 2048
  max_num_seqs: 4
  kv_cache_dtype: fp8
  quantization: nvfp4
env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  TORCH_ALLOW_TF32_CUBLAS: 1
  TORCH_ALLOW_TF32_CUDNN: 1
  TORCH_FLOAT32_MATMUL_PRECISION: high
  VLLM_FLOAT32_MATMUL_PRECISION: high
  FASTSAFETENSORS_NOGDS: 1
command: |
  vllm serve {model} \
    -tp {tensor_parallel} \
    --served-model-name nemotron-3-super \
    --host {host} \
    --port {port} \
    --dtype auto \
    --load-format fastsafetensors \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --mamba-ssm-cache-dtype float32 \
    --quantization {quantization} \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    --reasoning-parser nemotron_v3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --generation-config vllm 
