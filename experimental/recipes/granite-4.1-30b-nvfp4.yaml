recipe_version: '1'
name: granite-4.1-30b-nvfp4
description: vLLM serving granite-4.1-30b-nvfp4
model: revoman/granite-4.1-30b-nvfp4
runtime: vllm
container: vllm/vllm-openai:vllm-x86_64-cu13-0.25.1-7a33ba9
defaults:
  host: 0.0.0.0
  port: 8000
  gpu_memory_utilization: 0.90
  max_model_len: 32768
  kv_cache_dtype: fp8
  quantization: nvfp4
env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_WORKER_MULTIPROC_METHOD: spawn
command: |
  vllm serve {model} \
    --served-model-name granite-30b \
    --host {host} \
    --port {port} \
    --dtype auto \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --quantization {quantization} 
