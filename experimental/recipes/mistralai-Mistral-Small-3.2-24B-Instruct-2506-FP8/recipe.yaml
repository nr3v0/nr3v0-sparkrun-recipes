# NOTE: the source recipe (sparkrun/nrevo/.../recipe copy.yaml) set
# `--load-format mistral` and then `--load-format fastsafetensors` later in
# the same command - a duplicate flag where the second silently wins,
# discarding the mistral-format load path implied by --tokenizer-mode mistral
# / --config-format mistral. Kept `--load-format mistral` here (the one that
# actually matches this recipe's tokenizer/config settings) and dropped the
# conflicting fastsafetensors duplicate; verify this is what you intended.
recipe_version: '1'
name: mistralai-Mistral-Small-3.2-24B-Instruct-2506-FP8-cuda-13_3_1-vllm-0_25
description: >-
  vLLM serving mistralai/Mistral-Small-3.2-24B-Instruct-2506 (bf16 checkpoint)
  with runtime fp8 quantization, using cuda 13.3.1 and vllm 0.25
model: mistralai/Mistral-Small-3.2-24B-Instruct-2506
runtime: vllm
container: vllm/vllm-openai:vllm-x86_64-cu13-0.25.1-7a33ba9
defaults:
  host: 0.0.0.0
  port: 8000
  gpu_memory_utilization: 0.70
  max_model_len: 4096
  max_num_batched_tokens: 1024
  max_num_seqs: 1
  kv_cache_dtype: fp8
  quantization: fp8
env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_WORKER_MULTIPROC_METHOD: spawn
command: |
  vllm serve {model} \
    --served-model-name mistral-3.2-small \
    --host {host} \
    --port {port} \
    --dtype auto \
    --tokenizer-mode mistral \
    --config-format mistral \
    --load-format mistral \
    --tool-call-parser mistral \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --quantization {quantization} \
    --enable-auto-tool-choice \
    --enforce-eager \
    --generation-config vllm
