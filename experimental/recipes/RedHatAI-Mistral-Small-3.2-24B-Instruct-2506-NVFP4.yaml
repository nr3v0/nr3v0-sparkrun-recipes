recipe_version: '1'
name: RedHatAI-Mistral-Small-3.2-24B-Instruct-2506-NVFP4-cuda-13_3_1-vllm-0_25
description: vLLM serving RedHatAI/Mistral-Small-3.2-24B-Instruct-2506-NVFP4 using cuda 13.3.1 and vllm 0.25
model: RedHatAI/Mistral-Small-3.2-24B-Instruct-2506-NVFP4
runtime: vllm
container: vllm/vllm-openai:vllm-x86_64-cu13-0.25.1-7a33ba9
defaults:
  host: 0.0.0.0
  port: 8000
  gpu_memory_utilization: 0.70
  max_model_len: 8192
  max_num_batched_tokens: 1024
  max_num_seqs: 1
  kv_cache_dtype: fp8
env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_WORKER_MULTIPROC_METHOD: spawn
command: |
  vllm serve {model} \
    --served-model-name mistral-3.2-small \
    --host {host} \
    --port {port} \
    --dtype auto \
    --tool-call-parser mistral \
    --tokenizer_mode mistral \
    --limit-mm-per-prompt '{"image":0}' \
    --load-format fastsafetensors \
    --kv-cache-dtype {kv_cache_dtype} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-auto-tool-choice \
    --generation-config vllm
